<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Skill Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header id="header">
  <button id="btn-menu" class="hdr-icon-btn" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span id="logo">
    <span class="logo-mark" aria-hidden="true">✦</span>
    <span class="logo-text">Skill Dashboard</span>
  </span>
  <div id="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="search"
      placeholder="搜索 skill / 描述 / 标签…  按 / 聚焦"
      autocomplete="off" spellcheck="false">
    <kbd class="search-hint">/</kbd>
  </div>
  <span id="stats"></span>
  <button id="btn-favorites-toggle" class="hdr-btn" type="button" title="只看收藏">
    <span class="hdr-btn-icon">★</span><span class="hdr-btn-label">Favorites</span>
  </button>
  <button id="btn-rescan" class="hdr-btn" type="button" title="重新扫描">
    <span class="hdr-btn-icon">⟳</span><span class="hdr-btn-label">Rescan</span>
  </button>
  <button id="btn-feedback" class="hdr-btn hdr-btn-primary" type="button" title="发送反馈">
    <span class="hdr-btn-icon">💬</span><span class="hdr-btn-label">Feedback</span>
  </button>
</header>

<!-- ── Feedback modal ─────────────────────────────────────────────── -->
<div id="fb-modal" class="fb-hidden" role="dialog" aria-label="Feedback">
  <div id="fb-box">
    <div id="fb-header">
      <span>💬 Send feedback</span>
      <button id="fb-close" type="button" title="Close (Esc)">✕</button>
    </div>
    <textarea id="fb-text" placeholder="写下你的意见或建议…" rows="6"></textarea>
    <div id="fb-footer">
      <span id="fb-status"></span>
      <button id="fb-submit" type="button">Submit</button>
    </div>
  </div>
</div>

<!-- ── Layout ──────────────────────────────────────────────────────── -->
<div id="layout">

  <!-- Sidebar: all sections populated dynamically by app.js -->
  <nav id="sidebar" aria-label="Filters">
    <div class="sb-section" id="section-collections"></div>
    <div class="sb-divider"></div>
    <div class="sb-section" id="section-types"></div>
    <div class="sb-divider"></div>
    <div class="sb-section" id="section-tags"></div>
  </nav>

  <!-- Backdrop for mobile sidebar / drawer overlays -->
  <div id="backdrop" aria-hidden="true"></div>

  <!-- Main -->
  <main id="main">
    <div id="filter-bar">
      <!-- active filter chips + result count, populated by app.js -->
    </div>
    <div id="loading">Loading skill index…</div>
    <div id="cards" role="list"></div>
    <div id="empty" aria-live="polite">
      <h2>没有匹配的 skill</h2>
      <p>试试换个搜索词，或在侧边栏调整过滤条件。</p>
    </div>
  </main>

  <!-- Detail drawer -->
  <aside id="drawer" role="complementary" aria-label="Skill detail">
    <div id="drawer-header">
      <span id="drawer-title"></span>
      <div id="drawer-header-actions">
        <button id="btn-drawer-fav" type="button" title="加入收藏">☆</button>
        <button id="drawer-close" type="button" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div id="drawer-meta"></div>
    <div id="drawer-actions"></div>
    <div id="drawer-body"></div>
  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
